<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作品集</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        #modal-backdrop {
            transition: opacity 0.3s ease;
        }
        #modal-content {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .gallery-item {
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div id="app" class="container mx-auto p-4 md:p-8">
        
        <!-- 头部导航 -->
        <header class="mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-gray-900">作品集</h1>
            <nav id="breadcrumbs" class="text-lg mt-2 text-gray-600 flex flex-wrap items-center"></nav>
        </header>

        <!-- 加载动画 -->
        <div id="loader" class="text-center py-12 hidden">
            <svg class="animate-spin h-8 w-8 text-blue-600 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-2 text-gray-500 text-sm">正在读取 R2 存储桶...</p>
        </div>

        <!-- 错误提示框 -->
        <div id="error-message" class="text-center p-4 bg-red-100 text-red-700 rounded-lg hidden"></div>

        <!-- 照片与目录网格区 -->
        <main id="gallery-content" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
        </main>
    </div>

    <!-- 大图查看弹窗 Modal -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50 hidden" onclick="galleryApp.closeModal()">
        <div id="modal-content" class="relative bg-white rounded-lg shadow-2xl p-2 md:p-4 max-w-5xl max-h-[90vh] flex flex-col transform scale-95 opacity-0 overflow-hidden" onclick="event.stopPropagation()">
            <img id="modal-image" src="" alt="Full view" class="max-w-full max-h-[80vh] object-contain mx-auto rounded">
            <p id="modal-caption" class="text-center mt-3 text-gray-700 font-medium text-sm break-all"></p>
            
            <button onclick="galleryApp.closeModal()" class="absolute top-3 right-3 bg-white/80 hover:bg-white rounded-full p-2 text-gray-700 shadow transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
    </div>

    <script>
        const galleryApp = {
            // ==================================================================
            // --- 核心配置 ---
            // ==================================================================
            config: {
                // 1. 填入你的 Worker 域名
                workerApi: 'https://gallery-api.804435966.workers.dev', 

                // 2. 填入你的 R2 公开域名 (如 https://pub-xxx.r2.dev)
                r2PublicUrl: 'mufendd.de5.net', 
            },

            state: {
                currentPath: '',
            },

            elements: {
                loader: document.getElementById('loader'),
                errorMessage: document.getElementById('error-message'),
                galleryContent: document.getElementById('gallery-content'),
                breadcrumbs: document.getElementById('breadcrumbs'),
                modal: {
                    backdrop: document.getElementById('modal-backdrop'),
                    content: document.getElementById('modal-content'),
                    image: document.getElementById('modal-image'),
                    caption: document.getElementById('modal-caption'),
                }
            },

            init() {
                window.addEventListener('hashchange', () => this.handleHashChange());
                this.handleHashChange();
            },

            handleHashChange() {
                const rawHash = window.location.hash.substring(1);
                const path = decodeURIComponent(rawHash || '');
                this.loadGallery(path);
            },

            async loadGallery(path) {
                this.state.currentPath = path;
                this.elements.loader.classList.remove('hidden');
                this.elements.galleryContent.classList.add('hidden');
                this.elements.errorMessage.classList.add('hidden');
                this.elements.galleryContent.innerHTML = '';

                this.updateBreadcrumbs(path);

                const requestUrl = `${this.config.workerApi}/${encodeURIComponent(path)}`;

                try {
                    const response = await fetch(requestUrl);
                    if (!response.ok) {
                        throw new Error(`Worker 请求失败 (状态码: ${response.status})`);
                    }
                    const data = await response.json();

                    if (data.error) {
                        throw new Error(data.error);
                    }

                    const folders = data.folders || [];
                    const photos = data.photos || [];

                    folders.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
                    photos.sort((a, b) => a.localeCompare(b, 'zh-CN'));

                    this.renderFolders(folders);
                    this.renderPhotos(photos);

                    if (folders.length === 0 && photos.length === 0) {
                        this.elements.galleryContent.innerHTML = `
                            <div class="col-span-full text-center py-12 text-gray-400">
                                该目录下暂无文件夹或图片
                            </div>`;
                    }

                } catch (error) {
                    console.error('动态读取失败:', error);
                    this.elements.errorMessage.textContent = `加载失败: ${error.message}`;
                    this.elements.errorMessage.classList.remove('hidden');
                } finally {
                    this.elements.loader.classList.add('hidden');
                    this.elements.galleryContent.classList.remove('hidden');
                }
            },

            renderFolders(folders) {
                folders.forEach(folder => {
                    const folderName = folder.name;
                    const folderPath = `${this.state.currentPath ? this.state.currentPath + '/' : ''}${folderName}`;
                    
                    const element = document.createElement('a');
                    element.href = `#${encodeURIComponent(folderPath)}`;
                    element.className = 'gallery-item group relative aspect-square flex flex-col items-center justify-center bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow-md hover:border-blue-500 transition-all cursor-pointer p-2';
                    
                    element.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 text-blue-500 group-hover:text-blue-600 transition-colors" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z" />
                        </svg>
                        <span class="mt-2 text-sm font-medium text-center text-gray-700 px-1 truncate w-full" title="${folderName}">${folderName}</span>
                    `;
                    this.elements.galleryContent.appendChild(element);
                });
            },

            renderPhotos(photos) {
                photos.forEach(photoName => {
                    const relativePhotoPath = `${this.state.currentPath ? this.state.currentPath + '/' : ''}${photoName}`;
                    const photoUrl = `${this.config.r2PublicUrl}/${encodeURIComponent(relativePhotoPath)}`;
                    
                    const element = document.createElement('div');
                    element.className = 'gallery-item group relative aspect-square bg-gray-200 rounded-lg shadow-sm overflow-hidden cursor-pointer';
                    element.onclick = () => this.showModal(photoUrl, photoName);

                    const img = document.createElement('img');
                    img.src = photoUrl;
                    img.alt = photoName;
                    img.loading = 'lazy';
                    img.className = 'w-full h-full object-cover transition-transform duration-300 group-hover:scale-105';
                    img.onerror = function() {
                        this.parentElement.innerHTML = `<div class="w-full h-full flex items-center justify-center bg-gray-100 text-red-400 text-xs p-2 text-center">加载图片失败</div>`;
                    };

                    element.appendChild(img);
                    this.elements.galleryContent.appendChild(element);
                });
            },

            updateBreadcrumbs(path) {
                this.elements.breadcrumbs.innerHTML = '';
                const parts = path.split('/').filter(Boolean);
                
                const homeLink = document.createElement('a');
                homeLink.href = '#';
                homeLink.className = 'hover:text-blue-600 font-medium transition';
                homeLink.textContent = '首页';
                this.elements.breadcrumbs.appendChild(homeLink);

                let cumulativePath = '';
                parts.forEach(part => {
                    cumulativePath += (cumulativePath ? '/' : '') + part;
                    
                    const separator = document.createElement('span');
                    separator.className = 'mx-2 text-gray-400';
                    separator.textContent = '/';
                    this.elements.breadcrumbs.appendChild(separator);

                    const partLink = document.createElement('a');
                    partLink.href = `#${encodeURIComponent(cumulativePath)}`;
                    partLink.className = 'hover:text-blue-600 font-medium transition truncate max-w-[150px] inline-block align-bottom';
                    partLink.textContent = part;
                    this.elements.breadcrumbs.appendChild(partLink);
                });
            },

            showModal(imageUrl, caption) {
                this.elements.modal.image.src = imageUrl;
                this.elements.modal.caption.textContent = caption;
                
                this.elements.modal.backdrop.classList.remove('hidden');
                requestAnimationFrame(() => {
                    this.elements.modal.backdrop.classList.add('opacity-100');
                    this.elements.modal.content.classList.remove('scale-95', 'opacity-0');
                    this.elements.modal.content.classList.add('scale-100', 'opacity-100');
                });

                window.addEventListener('keydown', this.handleKeydown);
            },

            closeModal() {
                this.elements.modal.backdrop.classList.remove('opacity-100');
                this.elements.modal.content.classList.remove('scale-100', 'opacity-100');
                this.elements.modal.content.classList.add('scale-95', 'opacity-0');

                setTimeout(() => {
                    this.elements.modal.backdrop.classList.add('hidden');
                    this.elements.modal.image.src = '';
                }, 300);

                window.removeEventListener('keydown', this.handleKeydown);
            },

            handleKeydown(e) {
                if (e.key === 'Escape') {
                    galleryApp.closeModal();
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => galleryApp.init());
    </script>
</body>
</html>
